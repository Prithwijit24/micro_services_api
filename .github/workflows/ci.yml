name: API Health Check

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Chroma client/server alignment
        run: |
          client=$(grep -oP 'chromadb==\K[0-9.]+' pyproject.toml)
          server=$(grep -oP 'chromadb/chroma:\K[0-9.]+' docker-compose.yml)
          test -n "$client" && test -n "$server"
          if [ "$client" != "$server" ]; then
            echo "Chroma mismatch: client=$client server=$server"
            exit 1
          fi

      - name: Run comprehensive API tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: bash tests/comprehensive.sh

      - name: Run read-only database checks
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          API_BASE: ${{ secrets.API_BASE || 'https://aistackapi.duckdns.org' }}
        run: python3 tests/db_read_test.py

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 API health check failed — ${new Date().toISOString()}`,
              body: `The 6-hourly API health check failed. Check the [workflow run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'ci']
            });
