[project]
name = "ai-infra-stack"
version = "2.0.0"
description = "Unified AI infrastructure stack - single FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "sentence-transformers>=3.0",
    "yt-dlp>=2024.0",
    "neo4j>=5.0",
    "chromadb>=0.5.0,<1.0.0",  # pin to 0.x to match server image 0.5.23
    "playwright>=1.45",
    "ddgs>=9.0",
    "Pillow>=10.0",
    "aiomysql>=0.2.0",
    # Crawl replacements (replaces Firecrawl)
    "scrapling[fetchers]>=0.3",
    "trafilatura>=1.12",
    "html2text>=2024.2.26",
    # Qdrant
    "qdrant-client>=1.12.0",
    # DuckDB (embedded OLAP)
    "duckdb>=1.0.0",
    # MinIO (S3-compatible file storage)
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    # Whisper (speech-to-text fallback for YouTube transcripts)
    "faster-whisper>=1.0.0",
    # Free proxy rotation for anti-detection on cloud VMs
    "free-proxy>=1.2.0",
    "jupyterlab>=4.6.2",
]
