name: ai-stack

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Application (single FastAPI container with all services)
  # ──────────────────────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: ai-stack-app
    restart: unless-stopped
    networks:
      - internal
    env_file: .env
    environment:
      HF_HOME: /root/.cache/huggingface
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
    expose:
      - "8000"
    volumes:
      - ./models:/root/.cache/huggingface
      - ./data/browser:/data/browser
      - ./data/youtube:/opt/data/youtube
      - ./data/duckdb:/data/duckdb
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────────
  # Redis (cache + message broker)
  # ──────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ai-stack-redis
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./data/redis:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]

  # ──────────────────────────────────────────────────────────────────────────────
  # Neo4j (graph database) — kept as-is per user requirement
  # ──────────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-stack-neo4j
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # ChromaDB (vector database)
  # ──────────────────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: ai-stack-chromadb
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ./data/chroma:/chroma/chroma
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # SearXNG (meta search engine)
  # ──────────────────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: ai-stack-searxng
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
    volumes:
      - ./data/searxng:/etc/searxng
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # MinIO (S3-compatible file storage — for local filesystem access)
  # ──────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ai-stack-minio
    restart: unless-stopped
    networks:
      - internal
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./data/minio:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # Reverse proxy (Caddy)
  # ──────────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.9-alpine
    container_name: ai-stack-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app

  # ──────────────────────────────────────────────────────────────────────────────
  # Dozzle (lightweight log viewer)
  # ──────────────────────────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: ai-stack-dozzle
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:8081:8080"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
