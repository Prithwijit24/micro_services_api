name: ai-stack

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Application (single FastAPI container with all services)
  # ──────────────────────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: ai-stack-app
    restart: unless-stopped
    networks:
      - internal
    env_file: .env
    environment:
      HF_HOME: /root/.cache/huggingface
    shm_size: "2gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /var/tmp:size=64M
      - /root/.cache:size=512M
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
    expose:
      - "8000"
    volumes:
      - ./models:/root/.cache/huggingface
      - ./data/browser:/data/browser
      - ./data/youtube:/opt/data/youtube
      - ./data/duckdb:/data/duckdb
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────────
  # Redis (cache + message broker) — internal only
  # ──────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ai-stack-redis
    restart: unless-stopped
    networks:
      - internal
    command: ["redis-server", "--appendonly", "yes"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./data/redis:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]

  # ──────────────────────────────────────────────────────────────────────────────
  # Neo4j (graph database) — internal only
  # ──────────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-stack-neo4j
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "7687"
      - "7474"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # ChromaDB (vector database) — internal only
  # ──────────────────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: ai-stack-chromadb
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ./data/chroma:/chroma/chroma
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # SearXNG (meta search engine) — internal only
  # ──────────────────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: ai-stack-searxng
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
    volumes:
      - ./data/searxng:/etc/searxng
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # MinIO (S3-compatible file storage) — internal only
  # Access via SSH tunnel: ssh -L 9001:localhost:9001 ubuntu@<VM_IP>
  # ──────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ai-stack-minio
    restart: unless-stopped
    networks:
      - internal
    command: server /data --console-address ":9001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    expose:
      - "9000"
      - "9001"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./data/minio:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]

  # ──────────────────────────────────────────────────────────────────────────────
  # Dozzle (lightweight log viewer) — internal only
  # Access via SSH tunnel: ssh -L 8081:localhost:8081 ubuntu@<VM_IP>
  # ──────────────────────────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: ai-stack-dozzle
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro


networks:
  internal:
    driver: bridge
